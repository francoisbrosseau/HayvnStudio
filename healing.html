<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayvn Healing</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:240vh;
      overflow-x:hidden;
      font-family:system-ui,sans-serif;
      background:#030302;
      color:white;
    }

    .bg{
      position:fixed;
      inset:0;
      z-index:-3;

      background:
        radial-gradient(
          circle at center,
          rgba(215,173,95,.12) 0%,
          rgba(0,0,0,0) 34%
        ),

        linear-gradient(
          to bottom,
          rgba(0,0,0,.18),
          rgba(0,0,0,.58)
        ),

        url('images/healing-bg.webp');

      background-size:
        140% 140%,
        cover,
        auto 120%;

      background-position:
        center,
        center,
        center top;

      background-repeat:no-repeat;

      animation:bgFloat 22s ease-in-out infinite alternate;

      transform:scale(1.02);

      opacity:.96;
    }

    .overlay{
      position:fixed;
      inset:0;
      z-index:-2;

      background:
        radial-gradient(
          circle at center,
          rgba(255,220,140,.05),
          transparent 52%
        );
    }

    .grain{
      position:fixed;
      inset:0;
      z-index:-1;

      opacity:.06;
      pointer-events:none;

      background-image:
        url("https://grainy-gradients.vercel.app/noise.svg");
    }

    .hero{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;

      text-align:center;

      padding:40px;
    }

    h1{
      font-size:clamp(52px,8vw,140px);
      font-weight:300;
      letter-spacing:.08em;

      color:#f1d48b;

      text-shadow:
        0 0 12px rgba(241,212,139,.24),
        0 0 44px rgba(215,173,95,.12);

      animation:titleGlow 5s ease-in-out infinite alternate;
    }

    p{
      margin-top:22px;

      max-width:820px;

      font-size:clamp(18px,2vw,26px);
      line-height:1.8;

      opacity:.82;

      text-shadow:
        0 0 18px rgba(0,0,0,.45);
    }

    .scroll-space{
      height:140vh;
    }

    @keyframes bgFloat{

      0%{
        background-position:
          center,
          center,
          center top;
      }

      100%{
        background-position:
          center,
          center,
          center 6%;
      }
    }

    @keyframes titleGlow{

      0%{
        text-shadow:
          0 0 12px rgba(241,212,139,.24),
          0 0 44px rgba(215,173,95,.12);
      }

      100%{
        text-shadow:
          0 0 18px rgba(241,212,139,.38),
          0 0 64px rgba(215,173,95,.20);
      }
    }

    @media (max-width:900px){

      .bg{
        background-size:
          180% 180%,
          cover,
          auto 110%;
      }

      h1{
        font-size:clamp(42px,12vw,82px);
      }

      p{
        font-size:18px;
      }
    }

  </style>
</head>

<body>

  <div class="bg"></div>
  <div class="overlay"></div>
  <div class="grain"></div>

  <section class="hero">

    <h1>HAYVN HEALING</h1>

    <p>
      A sanctuary of grounding, restoration,
      ritual, and inner alignment.
    </p>

  </section>

  <div class="scroll-space"></div>

</body>
</html>
