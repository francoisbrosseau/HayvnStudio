<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HAYVN Healing</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#050505;
      color:white;
      overflow-x:hidden;
      font-family:Arial, sans-serif;
      min-height:220vh;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .bg-wrap{
      position:fixed;
      inset:0;
      z-index:-5;
      overflow:hidden;
    }

    .bg{
      position:absolute;
      inset:0;

      background-image:url('images/healing-bg-v2.webp');
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;

      transform:scale(1.05);

      animation:bgMove 18s ease-in-out infinite alternate;

      filter:
        brightness(.75)
        contrast(1.05)
        saturate(1.05);
    }

    .bg::after{
      content:"";
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at center,
          rgba(0,0,0,.0) 20%,
          rgba(0,0,0,.30) 58%,
          rgba(0,0,0,.82) 100%
        );
    }

    /* =========================
       GOLD ATMOSPHERE
    ========================= */

    .ambient{
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255,220,140,.20),
          transparent 45%
        );

      mix-blend-mode:screen;

      animation:ambientPulse 8s ease-in-out infinite;
    }

    /* =========================
       GRAIN
    ========================= */

    .grain{
      position:fixed;
      inset:0;
      z-index:-1;

      opacity:.05;
      pointer-events:none;

      background-image:
        url("https://grainy-gradients.vercel.app/noise.svg");
    }

    /* =========================
       HERO SECTION
    ========================= */

    .hero{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;

      text-align:center;

      padding:40px;
    }

    .hero-logo{
      width:min(620px,80vw);

      opacity:0;

      animation:
        logoReveal 2.2s ease forwards,
        logoFloat 5s ease-in-out infinite alternate;

      filter:
        drop-shadow(0 0 18px rgba(241,212,139,.22))
        drop-shadow(0 0 42px rgba(215,173,95,.14));
    }

    .hero-sub{
      margin-top:26px;

      max-width:780px;

      font-size:clamp(18px,2vw,25px);
      line-height:1.8;

      opacity:0;

      animation:
        textReveal 2s ease forwards;

      animation-delay:.7s;

      color:rgba(255,255,255,.84);

      text-shadow:
        0 0 20px rgba(0,0,0,.45);
    }

    /* =========================
       PLACEHOLDER SECTION
    ========================= */

    .placeholder{
      height:120vh;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes logoReveal{

      0%{
        opacity:0;
        transform:
          scale(.92)
          translateY(30px);
      }

      100%{
        opacity:1;
        transform:
          scale(1)
          translateY(0px);
      }
    }

    @keyframes textReveal{

      0%{
        opacity:0;
        transform:translateY(18px);
      }

      100%{
        opacity:1;
        transform:translateY(0px);
      }
    }

    @keyframes logoFloat{

      0%{
        transform:translateY(0px);
      }

      100%{
        transform:translateY(-10px);
      }
    }

    @keyframes bgMove{

      0%{
        transform:
          scale(1.05)
          translateY(0px);
      }

      100%{
        transform:
          scale(1.10)
          translateY(-30px);
      }
    }

    @keyframes ambientPulse{

      0%,100%{
        opacity:.45;
      }

      50%{
        opacity:.95;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:900px){

      .bg{
        background-position:center top;
      }

      .hero-logo{
        width:88vw;
      }

      .hero-sub{
        font-size:18px;
      }
    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->

  <div class="bg-wrap">

    <div class="bg"></div>

    <div class="ambient"></div>

  </div>

  <!-- GRAIN -->

  <div class="grain"></div>

  <!-- HERO -->

  <section class="hero">

    <img
      src="images/healing-logo.png"
      alt="HAYVN Healing"
      class="hero-logo"
    />

    <p class="hero-sub">
      A sanctuary of grounding, restoration,
      ritual, and inner alignment.
    </p>

  </section>

  <!-- PLACEHOLDER -->

  <section class="placeholder"></section>

</body>
</html>
