<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HAYVN Healing</title>

  <!-- FONTS -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Cinzel:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      background:#050505;
      color:white;
      overflow-x:hidden;
      font-family:"Cormorant Garamond", serif;
      min-height:220vh;
    }

    /* =========================
       BACKGROUND
    ========================= */

    .bg-wrap{
      position:fixed;
      inset:0;
      z-index:-5;
      overflow:hidden;
    }

    .bg{
      position:absolute;
      inset:0;

      background-image:url('images/healing-bg-v2.webp');
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;

      transform:scale(1.05);

      animation:bgMove 18s ease-in-out infinite alternate;

      filter:
        brightness(.82)
        contrast(1.05)
        saturate(1.08);
    }

    .bg::after{
      content:"";
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at center,
          rgba(0,0,0,.0) 20%,
          rgba(0,0,0,.28) 58%,
          rgba(0,0,0,.82) 100%
        );
    }

    /* =========================
       GOLD ATMOSPHERE
    ========================= */

    .ambient{
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at 50% 15%,
          rgba(255,220,140,.24),
          transparent 45%
        );

      mix-blend-mode:screen;

      animation:ambientPulse 8s ease-in-out infinite;
    }

    /* =========================
       GRAIN
    ========================= */

    .grain{
      position:fixed;
      inset:0;
      z-index:-1;

      opacity:.05;
      pointer-events:none;

      background-image:
        url("https://grainy-gradients.vercel.app/noise.svg");
    }

    /* =========================
       HERO SECTION
    ========================= */

    .hero{
      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;

      text-align:center;

      padding:40px;
    }

    .hero-logo{
      width:min(1150px,96vw);

      opacity:0;

      animation:
        logoReveal 2.2s ease forwards,
        logoFloat 5s ease-in-out infinite alternate;

      filter:
        brightness(1.18)
        drop-shadow(0 0 28px rgba(241,212,139,.40))
        drop-shadow(0 0 80px rgba(215,173,95,.28))
        drop-shadow(0 0 140px rgba(215,173,95,.16));
    }

    /* INITIAL LOGO GLOW FLASH */

    .hero-logo-wrap{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    .hero-logo-wrap::before{
      content:"";

      position:absolute;

      width:120%;
      height:120%;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(255,235,180,.48) 0%,
          rgba(241,212,139,.18) 30%,
          transparent 68%
        );

      filter:blur(34px);

      opacity:0;

      animation:logoFlash 3.5s ease forwards;

      pointer-events:none;
    }

    .hero-sub{
      margin-top:40px;

      max-width:980px;

      font-size:clamp(26px,2.4vw,42px);

      line-height:1.7;
      letter-spacing:.06em;

      opacity:0;

      animation:
        textReveal 2s ease forwards;

      animation-delay:.7s;

      color:rgba(246,228,185,.92);

      text-shadow:
        0 0 24px rgba(0,0,0,.60);

      font-family:"Cinzel", serif;

      font-weight:400;
    }

    /* =========================
       PLACEHOLDER
    ========================= */

    .placeholder{
      height:120vh;
    }

    /* =========================
       ANIMATIONS
    ========================= */

    @keyframes logoReveal{

      0%{
        opacity:0;

        transform:
          scale(.88)
          translateY(40px);
      }

      100%{
        opacity:1;

        transform:
          scale(1)
          translateY(0px);
      }
    }

    @keyframes logoFlash{

      0%{
        opacity:0;
        transform:scale(.55);
      }

      18%{
        opacity:1;
        transform:scale(1.04);
      }

      55%{
        opacity:.35;
        transform:scale(1.20);
      }

      100%{
        opacity:0;
        transform:scale(1.38);
      }
    }

    @keyframes textReveal{

      0%{
        opacity:0;
        transform:translateY(18px);
      }

      100%{
        opacity:1;
        transform:translateY(0px);
      }
    }

    @keyframes logoFloat{

      0%{
        transform:translateY(0px);
      }

      100%{
        transform:translateY(-10px);
      }
    }

    @keyframes bgMove{

      0%{
        transform:
          scale(1.05)
          translateY(0px);
      }

      100%{
        transform:
          scale(1.10)
          translateY(-30px);
      }
    }

    @keyframes ambientPulse{

      0%,100%{
        opacity:.45;
      }

      50%{
        opacity:.95;
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media(max-width:900px){

      .bg{
        background-position:center top;
      }

      .hero-logo{
        width:100vw;
      }

      .hero-sub{
        font-size:22px;
        line-height:1.7;
      }
    }

  </style>
</head>

<body>

  <!-- BACKGROUND -->

  <div class="bg-wrap">

    <div class="bg"></div>

    <div class="ambient"></div>

  </div>

  <!-- GRAIN -->

  <div class="grain"></div>

  <!-- HERO -->

  <section class="hero">

    <div class="hero-logo-wrap">

      <img
        src="images/healing-logo.png"
        alt="HAYVN Healing"
        class="hero-logo"
      />

    </div>

    <p class="hero-sub">
      A sanctuary of grounding, restoration,
      ritual, and inner alignment.
    </p>

  </section>

  <!-- PLACEHOLDER -->

  <section class="placeholder"></section>

</body>
</html>
