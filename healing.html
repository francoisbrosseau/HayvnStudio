<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hayvn Healing</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      min-height:260vh;
      overflow-x:hidden;
      font-family:system-ui,sans-serif;
      background:#020202;
      color:white;
    }

    /* =========================
       CINEMATIC BACKGROUND
    ========================== */

    .bg-wrap{
      position:fixed;
      inset:0;
      z-index:-5;
      overflow:hidden;
    }

    .bg{
      position:absolute;
      inset:-8%;

      background-image:url('images/healing-bg-v2.webp');
      background-size:cover;
      background-position:center center;
      background-repeat:no-repeat;

      transform:scale(1.12);

      animation:bgDrift 28s ease-in-out infinite alternate;

      filter:
        brightness(.82)
        contrast(1.05)
        saturate(1.05);
    }

    /* DARK CINEMATIC EDGES */

    .bg::after{
      content:"";
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at center,
          rgba(0,0,0,0) 28%,
          rgba(0,0,0,.22) 58%,
          rgba(0,0,0,.72) 100%
        );
    }

    /* GOLD ATMOSPHERE */

    .ambient{
      position:absolute;
      inset:0;

      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(241,212,139,.18),
          rgba(241,212,139,.06) 24%,
          transparent 52%
        );

      mix-blend-mode:screen;

      animation:ambientPulse 8s ease-in-out infinite;
    }

    /* SOFT GRAIN */

    .grain{
      position:fixed;
      inset:0;
      z-index:-1;

      opacity:.04;
      pointer-events:none;

      background-image:
        url("https://grainy-gradients.vercel.app/noise.svg");
    }

    /* =========================
       HERO
    ========================== */

    .hero{
      position:relative;

      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;

      text-align:center;

      padding:40px;
    }

    h1{
      font-size:clamp(54px,8vw,150px);
      font-weight:300;
      letter-spacing:.08em;

      color:#f1d48b;

      text-shadow:
        0 0 14px rgba(241,212,139,.28),
        0 0 48px rgba(215,173,95,.16),
        0 0 90px rgba(215,173,95,.10);

      animation:titleGlow 6s ease-in-out infinite alternate;
    }

    p{
      margin-top:22px;

      max-width:820px;

      font-size:clamp(18px,2vw,26px);
      line-height:1.8;

      opacity:.84;

      text-shadow:
        0 0 18px rgba(0,0,0,.55);
    }

    /* SCROLL SPACE */

    .scroll-space{
      height:160vh;
    }

    /* =========================
       ANIMATIONS
    ========================== */

    @keyframes bgDrift{

      0%{
        transform:
          scale(1.12)
          translateY(0px);
      }

      100%{
        transform:
          scale(1.18)
          translateY(-40px);
      }
    }

    @keyframes ambientPulse{

      0%,100%{
        opacity:.55;
        transform:scale(1);
      }

      50%{
        opacity:.9;
        transform:scale(1.06);
      }
    }

    @keyframes titleGlow{

      0%{
        text-shadow:
          0 0 14px rgba(241,212,139,.24),
          0 0 48px rgba(215,173,95,.14),
          0 0 90px rgba(215,173,95,.08);
      }

      100%{
        text-shadow:
          0 0 22px rgba(241,212,139,.40),
          0 0 74px rgba(215,173,95,.22),
          0 0 120px rgba(215,173,95,.14);
      }
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width:900px){

      .bg{
        background-position:center top;
        transform:scale(1.18);
      }

      h1{
        font-size:clamp(42px,12vw,90px);
      }

      p{
        font-size:18px;
      }
    }

  </style>
</head>

<body>

  <div class="bg-wrap">

    <div class="bg"></div>

    <div class="ambient"></div>

  </div>

  <div class="grain"></div>

  <section class="hero">

    <h1>HAYVN HEALING</h1>

    <p>
      A sanctuary of grounding, restoration,
      ritual, and inner alignment.
    </p>

  </section>

  <div class="scroll-space"></div>

</body>
</html>
