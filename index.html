<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#030302">

  <title>Hayvn | Three Paths. One Purpose.</title>

  <link rel="preload" as="image" href="images/hayvn-logo-gold.png">
  <link rel="preload" as="image" href="images/hayvn-portal-mobile.png">

  <style>

    /* =========================================================
       ROOT / RESET
    ========================================================= */

    :root{
      --gold-soft:#f1d48b;
      --gold:#d7ad5f;
      --black:#030302;
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;

      width:100%;
      height:100%;

      overflow:hidden;

      background:#030302;

      font-family:system-ui,sans-serif;

      -webkit-tap-highlight-color:transparent;
    }

    body{
      min-height:100vh;
      min-height:100dvh;
    }


    /* =========================================================
       MAIN PORTAL
    ========================================================= */

    .portal{
      position:relative;

      width:100vw;

      height:100vh;
      height:100dvh;

      display:flex;
      align-items:center;
      justify-content:center;

      background:#030302;

      overflow:hidden;

      isolation:isolate;
    }


    /* Soft global atmosphere */

    .portal::before{
      content:"";

      position:absolute;
      inset:-20%;

      z-index:0;

      pointer-events:none;

      background:
        radial-gradient(
          circle at center,
          rgba(215,173,95,.10),
          rgba(215,173,95,.035) 28%,
          transparent 58%
        );

      animation:
        backgroundBreath 6s ease-in-out infinite;
    }


    /* Initial central gold impact */

    .portal::after{
      content:"";

      position:absolute;
      inset:-10%;

      z-index:0;

      pointer-events:none;

      opacity:0;

      background:
        radial-gradient(
          circle at 50% 22%,
          rgba(241,212,139,.34),
          rgba(215,173,95,.15) 16%,
          rgba(215,173,95,.045) 34%,
          transparent 58%
        );

      animation:
        logoImpact 4.5s ease forwards .8s;
    }


    /* =========================================================
       BACKGROUND ANIMATIONS
    ========================================================= */

    @keyframes backgroundBreath{

      0%,
      100%{
        opacity:.45;
        transform:scale(1);
      }

      50%{
        opacity:.78;
        transform:scale(1.05);
      }

    }


    @keyframes logoImpact{

      0%{
        opacity:0;
        transform:scale(.82);
        filter:blur(20px);
      }

      24%{
        opacity:1;
        transform:scale(1.02);
        filter:blur(4px);
      }

      60%{
        opacity:.42;
        transform:scale(1.24);
        filter:blur(12px);
      }

      100%{
        opacity:0;
        transform:scale(1.42);
        filter:blur(28px);
      }

    }


    /* =========================================================
       PORTAL STAGE
    ========================================================= */

    .portal-stage{
      position:relative;

      overflow:hidden;

      width:min(100vw,177.78vh);
      height:min(100vh,56.25vw);

      opacity:0;

      animation:
        portalReveal 4.2s ease forwards;

      z-index:1;
    }


    /* Cinematic reveal sweep */

    .portal-stage::before{
      content:"";

      position:absolute;
      inset:-10%;

      z-index:3;

      pointer-events:none;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,245,200,.26) 0%,
          rgba(241,212,139,.18) 12%,
          rgba(215,173,95,.12) 24%,
          rgba(80,20,0,.22) 36%,
          rgba(0,0,0,.94) 58%
        );

      mix-blend-mode:screen;

      filter:
        blur(18px)
        contrast(130%)
        saturate(135%);

      transform:
        translateX(-135%)
        skewX(-8deg)
        scale(1.3);

      animation:
        burnReveal 4.8s cubic-bezier(.18,.7,.2,1)
        forwards .2s;
    }


    /* Ember trail */

    .portal-stage::after{
      content:"";

      position:absolute;
      inset:-10%;

      z-index:2;

      pointer-events:none;

      background:
        radial-gradient(
          circle at 50% 50%,
          rgba(255,240,180,.10) 0%,
          rgba(241,212,139,.05) 14%,
          transparent 36%
        );

      opacity:0;

      filter:
        blur(24px)
        saturate(140%);

      transform:
        translateX(-135%)
        skewX(-8deg)
        scale(1.5);

      animation:
        emberTrail 5s ease forwards .4s;
    }


    /* =========================================================
       HAYVN LOGO FLASH
    ========================================================= */

    .hayvn-flash{
      position:absolute;

      left:31%;
      top:8.5%;

      width:38%;
      height:22%;

      z-index:4;

      pointer-events:none;

      opacity:0;

      background:
        radial-gradient(
          ellipse at center,
          rgba(255,246,205,.44) 0%,
          rgba(241,212,139,.25) 24%,
          rgba(215,173,95,.10) 46%,
          transparent 72%
        );

      filter:
        blur(14px)
        drop-shadow(
          0 0 28px rgba(241,212,139,.45)
        )
        drop-shadow(
          0 0 68px rgba(215,173,95,.25)
        );

      animation:
        hayvnLogoSettle 4.4s ease forwards 1.25s;
    }


    @keyframes hayvnLogoSettle{

      0%{
        opacity:0;

        transform:
          scale(.72)
          translateY(18px);

        filter:blur(28px);
      }

      22%{
        opacity:1;

        transform:scale(1.08);
      }

      46%{
        opacity:.72;

        transform:scale(1.18);
      }

      100%{
        opacity:0;

        transform:scale(1.35);

        filter:blur(30px);
      }

    }


    @keyframes burnReveal{

      0%{
        transform:
          translateX(-135%)
          skewX(-8deg)
          scale(1.3);

        opacity:0;
      }

      10%,
      55%{
        opacity:1;
      }

      100%{
        transform:
          translateX(145%)
          skewX(-8deg)
          scale(1.36);

        opacity:0;
      }

    }


    @keyframes emberTrail{

      0%{
        opacity:0;
      }

      12%{
        opacity:.7;
      }

      65%{
        opacity:.34;
      }

      100%{
        opacity:0;

        transform:
          translateX(145%)
          skewX(-8deg)
          scale(1.7);
      }

    }


    /* =========================================================
       PORTAL IMAGE
    ========================================================= */

    picture,
    .portal-image{
      width:100%;
      height:100%;
      display:block;
    }

    .portal-image{
      object-fit:contain;

      user-select:none;

      -webkit-user-drag:none;

      pointer-events:none;
    }


    /* =========================================================
       PORTAL LINKS — DESKTOP
    ========================================================= */

    .portal-link{
      position:absolute;

      z-index:5;

      display:block;

      cursor:pointer;

      width:17.9%;

      aspect-ratio:1/1;

      border-radius:50%;

      background:transparent;

      border:1px solid transparent;

      outline:none;

      transition:
        transform .28s ease,
        box-shadow .28s ease,
        border-color .28s ease,
        background .28s ease;

      animation:
        circleAwaken 2.8s ease forwards 4.6s;

      touch-action:manipulation;
    }


    /*
       DESKTOP awakening rings.
       These remain untouched visually.
    */

    @keyframes circleAwaken{

      0%{
        border-color:transparent;
        box-shadow:none;
      }

      22%{
        border-color:
          rgba(241,212,139,.95);

        box-shadow:
          0 0 22px rgba(241,212,139,.85),
          0 0 52px rgba(215,173,95,.58),
          0 0 92px rgba(215,173,95,.30),
          inset 0 0 26px rgba(241,212,139,.12);
      }

      52%{
        border-color:
          rgba(241,212,139,.68);

        box-shadow:
          0 0 16px rgba(241,212,139,.54),
          0 0 38px rgba(215,173,95,.36),
          0 0 68px rgba(215,173,95,.18),
          inset 0 0 18px rgba(241,212,139,.08);
      }

      100%{
        border-color:transparent;
        box-shadow:none;
      }

    }


    .portal-link:hover,
    .portal-link:focus-visible{

      transform:scale(1.025);

      border-color:
        rgba(241,212,139,.48);

      box-shadow:
        0 0 10px rgba(241,212,139,.42),
        0 0 24px rgba(215,173,95,.30),
        0 0 48px rgba(215,173,95,.13),
        inset 0 0 14px rgba(241,212,139,.06);

      animation:
        portalPulse 1.8s ease-in-out infinite;
    }


    @keyframes portalPulse{

      0%,
      100%{
        box-shadow:
          0 0 10px rgba(241,212,139,.38),
          0 0 22px rgba(215,173,95,.26),
          0 0 42px rgba(215,173,95,.11),
          inset 0 0 14px rgba(241,212,139,.05);
      }

      50%{
        box-shadow:
          0 0 14px rgba(241,212,139,.58),
          0 0 32px rgba(215,173,95,.42),
          0 0 62px rgba(215,173,95,.20),
          inset 0 0 18px rgba(241,212,139,.08);
      }

    }


    /* Desktop portal positioning */

    .healing{
      left:21%;
      top:42.25%;
    }

    .studio{
      left:40.85%;
      top:42.25%;
    }

    .boudoir{
      left:60.90%;
      top:42.25%;
    }


    /* =========================================================
       AUDIO CONTROL
    ========================================================= */

    .audio-toggle{
      position:fixed;

      right:18px;
      bottom:18px;

      z-index:20;

      width:46px;
      height:46px;

      border:1px solid transparent;

      border-radius:999px;

      background:rgba(0,0,0,.42);

      -webkit-backdrop-filter:blur(12px);
      backdrop-filter:blur(12px);

      color:var(--gold-soft);

      cursor:pointer;

      font-size:18px;
      font-weight:900;

      display:flex;
      align-items:center;
      justify-content:center;

      box-shadow:
        0 4px 20px rgba(0,0,0,.22);

      transition:
        transform .25s ease,
        opacity .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

      touch-action:manipulation;
    }

    .audio-toggle:hover,
    .audio-toggle:focus-visible{

      transform:scale(1.08);

      border-color:
        rgba(241,212,139,.24);

      box-shadow:
        0 0 16px rgba(241,212,139,.13),
        0 4px 20px rgba(0,0,0,.28);

      outline:none;
    }

    .audio-toggle.muted{
      opacity:.55;
    }


    /* =========================================================
       PORTAL ENTRANCE
    ========================================================= */

    @keyframes portalReveal{

      0%{
        opacity:0;

        transform:
          scale(1.1)
          translateY(14px);

        filter:
          blur(30px)
          brightness(.45);
      }

      34%{
        opacity:.38;

        filter:
          blur(16px)
          brightness(.72);
      }

      68%{
        opacity:1;

        transform:scale(1.018);

        filter:
          blur(0)
          brightness(1.05);
      }

      100%{
        opacity:1;

        transform:scale(1);

        filter:
          blur(0)
          brightness(1);
      }

    }


    /* =========================================================
       VIDEO TRANSITION
    ========================================================= */

    .transition-layer{
      position:fixed;
      inset:0;

      z-index:999;

      background:#030302;

      opacity:0;

      pointer-events:none;

      transition:
        opacity 1600ms ease;

      overflow:hidden;
    }

    .transition-layer.active{
      opacity:1;
      pointer-events:auto;
    }

    .transition-layer video{
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:contain;

      background:#030302;

      opacity:0;

      transform:scale(.985);

      transition:
        opacity 1800ms ease,
        transform 2400ms ease;

      pointer-events:auto;

      cursor:pointer;

      display:none;
    }

    .transition-layer video.active-video{
      display:block;

      opacity:1;

      transform:scale(1);
    }

    .transition-layer.fade-black{
      background:#000;
    }

    .transition-layer.fade-black
    video.active-video{

      opacity:0;

      transform:scale(1.012);

      transition:
        opacity 1600ms ease,
        transform 1600ms ease;
    }


    /* =========================================================
       MOBILE POLISH
    ========================================================= */

    @media (max-width:760px){

      html,
      body{
        height:100%;

        min-height:100%;

        background:#030302;

        overscroll-behavior:none;
      }


      /* -----------------------------------------
         MOBILE PORTAL FRAME
      ----------------------------------------- */

      .portal{
        height:100vh;
        height:100dvh;

        min-height:100dvh;

        background:
          radial-gradient(
            ellipse at 50% 45%,
            rgba(215,173,95,.035) 0%,
            rgba(3,3,2,0) 55%
          ),
          #030302;
      }


      /*
         Softer overall breathing atmosphere.
         Keeps mobile alive without giant rings.
      */

      .portal::before{
        inset:-8%;

        background:
          radial-gradient(
            ellipse at 50% 48%,
            rgba(241,212,139,.075) 0%,
            rgba(215,173,95,.028) 35%,
            transparent 68%
          );

        animation:
          mobileAtmosphere 7s ease-in-out infinite;
      }


      /*
         Smaller logo impact on phones.
      */

      .portal::after{
        inset:-4%;

        background:
          radial-gradient(
            ellipse at 50% 15%,
            rgba(241,212,139,.20),
            rgba(215,173,95,.075) 22%,
            transparent 52%
          );

        animation:
          mobileLogoImpact 4.2s ease forwards .7s;
      }


      .portal-stage{
        width:100vw;

        height:100vh;
        height:100dvh;

        min-height:100dvh;

        overflow:hidden;

        animation:
          mobilePortalReveal 3.6s ease forwards;
      }


      /*
         Subtle top/bottom depth.
         This is intentionally much softer than
         the desktop cinematic treatment.
      */

      .portal-stage::before{
        inset:0;

        z-index:3;

        background:
          linear-gradient(
            to bottom,
            rgba(0,0,0,.22) 0%,
            transparent 15%,
            transparent 82%,
            rgba(0,0,0,.28) 100%
          );

        mix-blend-mode:normal;

        filter:none;

        transform:none;

        opacity:0;

        animation:
          mobileEdgeFade 2.4s ease forwards .7s;
      }


      /*
         Gentle gold sweep on initial mobile reveal.
      */

      .portal-stage::after{
        inset:-20% -60%;

        z-index:2;

        background:
          linear-gradient(
            110deg,
            transparent 36%,
            rgba(241,212,139,.035) 46%,
            rgba(241,212,139,.10) 50%,
            rgba(215,173,95,.035) 54%,
            transparent 64%
          );

        filter:blur(12px);

        opacity:0;

        transform:translateX(-32%);

        animation:
          mobileLightSweep 3.4s ease forwards .5s;
      }


      .portal-image{
        width:100%;
        height:100%;

        object-fit:cover;

        object-position:center center;

        filter:
          brightness(1.015)
          contrast(1.015)
          saturate(1.025);
      }


      /* -----------------------------------------
         MOBILE HAYVN LOGO GLOW
      ----------------------------------------- */

      .hayvn-flash{
        left:12%;
        top:5.5%;

        width:76%;
        height:18%;

        background:
          radial-gradient(
            ellipse at center,
            rgba(255,246,205,.24) 0%,
            rgba(241,212,139,.12) 27%,
            rgba(215,173,95,.045) 50%,
            transparent 72%
          );

        filter:
          blur(18px)
          drop-shadow(
            0 0 24px rgba(241,212,139,.20)
          );

        animation:
          mobileHayvnSettle 4.1s ease forwards 1s;
      }


      /* -----------------------------------------
         MOBILE PORTALS

         IMPORTANT:
         No giant circular ring animation here.
         Links remain transparent and clickable.
      ----------------------------------------- */

      .portal-link{
        width:48%;

        border:none;

        box-shadow:none;

        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,.018) 0%,
            rgba(215,173,95,.008) 38%,
            transparent 68%
          );

        animation:
          mobilePortalAwaken 2.4s ease forwards 3.5s;

        transition:
          transform .22s ease,
          filter .22s ease,
          background .22s ease,
          box-shadow .22s ease;

        -webkit-tap-highlight-color:transparent;
      }


      /*
         Explicitly kill desktop ring behavior
         on touch/mobile.
      */

      .portal-link:hover,
      .portal-link:focus-visible{

        border:none;

        animation:none;

        transform:none;

        box-shadow:
          0 0 26px rgba(241,212,139,.09),
          0 0 52px rgba(215,173,95,.035);

        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,.055) 0%,
            rgba(215,173,95,.022) 40%,
            transparent 70%
          );
      }


      /*
         Finger press feedback.
         No ring — only a small glow and scale.
      */

      .portal-link:active{

        transform:scale(.975);

        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,.11) 0%,
            rgba(215,173,95,.045) 38%,
            transparent 70%
          );

        box-shadow:
          0 0 22px rgba(241,212,139,.10),
          0 0 48px rgba(215,173,95,.05);
      }


      /* Mobile clickable locations */

      .healing{
        left:23%;
        top:30%;
      }

      .studio{
        left:26%;
        top:54%;
      }

      .boudoir{
        left:26%;
        top:74%;
      }


      /* -----------------------------------------
         MOBILE AUDIO BUTTON
      ----------------------------------------- */

      .audio-toggle{

        width:42px;
        height:42px;

        right:
          max(
            14px,
            env(safe-area-inset-right)
          );

        bottom:
          max(
            14px,
            env(safe-area-inset-bottom)
          );

        background:
          rgba(0,0,0,.48);

        border:
          1px solid rgba(241,212,139,.10);

        box-shadow:
          0 5px 22px rgba(0,0,0,.32),
          0 0 14px rgba(215,173,95,.045);

        font-size:17px;
      }

      .audio-toggle:hover,
      .audio-toggle:focus-visible{
        transform:none;
      }

      .audio-toggle:active{
        transform:scale(.94);
      }


      /* -----------------------------------------
         MOBILE VIDEO TRANSITIONS
      ----------------------------------------- */

      .transition-layer{
        height:100vh;
        height:100dvh;

        background:#030302;
      }

      .transition-layer video{

        width:100%;
        height:100%;

        object-fit:cover;

        object-position:center center;

        background:#030302;

        transform:scale(1.01);
      }

      .transition-layer
      video.active-video{

        transform:scale(1);
      }

    }


    /* =========================================================
       SMALL PHONE POLISH
    ========================================================= */

    @media (max-width:430px){

      .hayvn-flash{
        left:9%;
        width:82%;
      }

      /*
         Slightly narrower invisible touch areas
         to reduce accidental overlap on small phones.
      */

      .portal-link{
        width:46%;
      }

      .healing{
        left:24%;
      }

      .studio{
        left:27%;
      }

      .boudoir{
        left:27%;
      }

    }


    /* =========================================================
       MOBILE ANIMATIONS
    ========================================================= */

    @keyframes mobileAtmosphere{

      0%,
      100%{
        opacity:.52;
        transform:scale(1);
      }

      50%{
        opacity:.82;
        transform:scale(1.035);
      }

    }


    @keyframes mobileLogoImpact{

      0%{
        opacity:0;
        transform:scale(.88);
        filter:blur(18px);
      }

      30%{
        opacity:.72;
        transform:scale(1);
        filter:blur(8px);
      }

      70%{
        opacity:.20;
        transform:scale(1.14);
        filter:blur(18px);
      }

      100%{
        opacity:0;
        transform:scale(1.24);
        filter:blur(26px);
      }

    }


    @keyframes mobilePortalReveal{

      0%{
        opacity:0;

        transform:
          scale(1.045)
          translateY(8px);

        filter:
          blur(18px)
          brightness(.58);
      }

      45%{
        opacity:.72;

        filter:
          blur(7px)
          brightness(.84);
      }

      78%{
        opacity:1;

        transform:
          scale(1.008)
          translateY(0);

        filter:
          blur(0)
          brightness(1.025);
      }

      100%{
        opacity:1;

        transform:scale(1);

        filter:
          blur(0)
          brightness(1);
      }

    }


    @keyframes mobileEdgeFade{

      0%{
        opacity:0;
      }

      100%{
        opacity:1;
      }

    }


    @keyframes mobileLightSweep{

      0%{
        opacity:0;
        transform:translateX(-32%);
      }

      25%{
        opacity:.8;
      }

      72%{
        opacity:.38;
      }

      100%{
        opacity:0;
        transform:translateX(32%);
      }

    }


    @keyframes mobileHayvnSettle{

      0%{
        opacity:0;

        transform:
          scale(.84)
          translateY(10px);

        filter:blur(24px);
      }

      26%{
        opacity:.72;

        transform:scale(1.02);
      }

      52%{
        opacity:.36;

        transform:scale(1.09);
      }

      100%{
        opacity:0;

        transform:scale(1.20);

        filter:blur(26px);
      }

    }


    /*
       MOBILE replacement for the three lighting rings.

       Very small ambient pulse only.
       There is deliberately NO visible border.
    */

    @keyframes mobilePortalAwaken{

      0%{
        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,0) 0%,
            transparent 68%
          );

        box-shadow:none;
      }

      35%{
        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,.07) 0%,
            rgba(215,173,95,.025) 36%,
            transparent 68%
          );

        box-shadow:
          0 0 28px rgba(241,212,139,.07),
          0 0 58px rgba(215,173,95,.025);
      }

      68%{
        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,.035) 0%,
            rgba(215,173,95,.012) 40%,
            transparent 68%
          );

        box-shadow:
          0 0 20px rgba(241,212,139,.035),
          0 0 42px rgba(215,173,95,.015);
      }

      100%{
        background:
          radial-gradient(
            circle at center,
            rgba(241,212,139,.018) 0%,
            rgba(215,173,95,.008) 38%,
            transparent 68%
          );

        box-shadow:none;
      }

    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion:reduce){

      .portal::before,
      .portal::after,
      .portal-stage,
      .portal-stage::before,
      .portal-stage::after,
      .hayvn-flash,
      .portal-link{

        animation-duration:.01ms !important;
        animation-delay:0ms !important;
        animation-iteration-count:1 !important;
      }

      .portal-link,
      .audio-toggle,
      .transition-layer,
      .transition-layer video{

        transition-duration:.01ms !important;
      }

    }

  </style>
</head>


<body>

  <!-- =======================================================
       MAIN HAYVN PORTAL
  ======================================================== -->

  <main class="portal">

    <div class="portal-stage">

      <picture>

        <source
          media="(max-width:760px)"
          srcset="images/hayvn-portal-mobile.png"
        >

        <img
          class="portal-image"
          src="images/hayvn-logo-gold.png"
          alt="Hayvn Portal"
          fetchpriority="high"
          decoding="async"
        >

      </picture>


      <!-- Logo glow / reveal -->

      <div class="hayvn-flash"></div>


      <!-- HEALING -->

      <a
        class="portal-link healing"
        href="healing.html"
        onclick="videoPortalExit(event,this.href,'healingVideo')"
        aria-label="Hayvn Healing"
      ></a>


      <!-- STUDIO -->

      <a
        class="portal-link studio"
        href="studio.html?skipIntro=1"
        onclick="videoPortalExit(event,this.href,'studioVideo')"
        aria-label="Hayvn Studio"
      ></a>


      <!-- BOUDOIR -->

      <a
        class="portal-link boudoir"
        href="boudoir.html"
        onclick="videoPortalExit(event,this.href,'boudoirVideo')"
        aria-label="Hayvn Boudoir"
      ></a>

    </div>

  </main>


  <!-- =======================================================
       TRANSITION VIDEOS
  ======================================================== -->

  <div
    class="transition-layer"
    id="videoTransition"
  >

    <video
      id="healingVideo"
      src="videos/healing-transition.mp4"
      playsinline
      preload="auto"
      loop
    ></video>


    <video
      id="studioVideo"
      src="videos/studio-transition.mp4"
      playsinline
      preload="auto"
      loop
    ></video>


    <video
      id="boudoirVideo"
      src="videos/boudoir-transition.mp4"
      playsinline
      preload="auto"
      loop
    ></video>

  </div>


  <!-- =======================================================
       PORTAL MUSIC
  ======================================================== -->

  <audio
    id="portalMusic"
    src="audio/intro-reveal.mp3"
    preload="auto"
    loop
  ></audio>


  <button
    class="audio-toggle"
    id="audioToggle"
    type="button"
    aria-label="Toggle music"
  >
    ♪
  </button>


  <!-- =======================================================
       JAVASCRIPT
  ======================================================== -->

  <script>

    const portalMusic =
      document.getElementById("portalMusic");

    const audioToggle =
      document.getElementById("audioToggle");

    const videoTransition =
      document.getElementById("videoTransition");

    const healingVideo =
      document.getElementById("healingVideo");

    const studioVideo =
      document.getElementById("studioVideo");

    const boudoirVideo =
      document.getElementById("boudoirVideo");


    const allVideos = [
      healingVideo,
      studioVideo,
      boudoirVideo
    ];


    let muted = false;

    let navigating = false;

    let fallbackTimeout = null;

    let redirectTimeout = null;


    /* =========================================================
       RESET PORTAL
    ========================================================= */

    function resetPortalState(){

      navigating = false;

      document.body.style.opacity = "1";
      document.body.style.filter = "none";


      if(fallbackTimeout){

        clearTimeout(fallbackTimeout);

        fallbackTimeout = null;
      }


      if(redirectTimeout){

        clearTimeout(redirectTimeout);

        redirectTimeout = null;
      }


      videoTransition.classList.remove(
        "active",
        "fade-black"
      );


      allVideos.forEach(video => {

        video.pause();

        video.currentTime = 0;

        video.onended = null;

        video.onclick = null;

        video.classList.remove(
          "active-video"
        );

        video.style.display = "none";

      });


      if(portalMusic){

        portalMusic.volume = 0.38;

        portalMusic.currentTime = 0;

        portalMusic.muted = muted;

        if(!muted){
          portalMusic.play().catch(() => {});
        }

      }

    }


    window.addEventListener(
      "pageshow",
      () => setTimeout(
        resetPortalState,
        80
      )
    );


    window.addEventListener(
      "focus",
      () => setTimeout(
        resetPortalState,
        80
      )
    );


    document.addEventListener(
      "visibilitychange",
      () => {

        if(!document.hidden){

          setTimeout(
            resetPortalState,
            80
          );

        }

      }
    );


    /* =========================================================
       AUDIO
    ========================================================= */

    function updateAudioButton(){

      audioToggle.textContent =
        muted ? "♪̸" : "♪";


      audioToggle.classList.toggle(
        "muted",
        muted
      );


      portalMusic.muted =
        muted;

    }


    function startMusic(){

      if(muted) return;


      portalMusic.volume = 0.38;

      portalMusic.muted = false;


      portalMusic
        .play()
        .catch(() => {});

    }


    function fadePortalMusic(
      targetVolume,
      duration
    ){

      const startVolume =
        portalMusic.volume;

      const startTime =
        performance.now();


      function step(now){

        const progress =
          Math.min(
            (now - startTime) /
            duration,
            1
          );


        portalMusic.volume =
          startVolume +
          (
            targetVolume -
            startVolume
          ) * progress;


        if(progress < 1){

          requestAnimationFrame(
            step
          );

        }

      }


      requestAnimationFrame(
        step
      );

    }


    /* =========================================================
       VIDEO PORTAL EXIT
    ========================================================= */

    function videoPortalExit(
      event,
      url,
      videoId
    ){

      event.preventDefault();


      if(navigating) return;


      navigating = true;


      const selectedVideo =
        document.getElementById(
          videoId
        );


      allVideos.forEach(video => {

        if(video.id !== videoId){

          video.pause();

          video.currentTime = 0;

          video.classList.remove(
            "active-video"
          );

          video.style.display =
            "none";

        }

      });


      /*
         Existing transition durations preserved.
      */

      let maxDuration = 10000;


      if(
        videoId === "studioVideo"
      ){

        maxDuration = 15500;

      }


      if(
        videoId === "boudoirVideo"
      ){

        maxDuration = 11000;

      }


      selectedVideo.style.display =
        "block";


      selectedVideo.currentTime = 0;


      selectedVideo.muted =
        muted;


      selectedVideo.volume =
        muted ? 0 : 0.85;


      videoTransition
        .classList
        .remove(
          "fade-black"
        );


      videoTransition
        .classList
        .add(
          "active"
        );


      requestAnimationFrame(
        () => {

          selectedVideo
            .classList
            .add(
              "active-video"
            );

        }
      );


      fadePortalMusic(
        0.04,
        1600
      );


      /*
         Clicking / tapping the transition video
         still skips directly to the selected site.
      */

      selectedVideo.onclick =
        () => {

          window.location.assign(
            url
          );

        };


      selectedVideo
        .play()
        .catch(() => {

          redirectTimeout =
            setTimeout(
              () => {

                window.location.assign(
                  url
                );

              },
              2200
            );

        });


      /*
         Existing timed transition behavior preserved.
      */

      fallbackTimeout =
        setTimeout(
          () => {

            videoTransition
              .classList
              .add(
                "fade-black"
              );


            redirectTimeout =
              setTimeout(
                () => {

                  window.location.assign(
                    url
                  );

                },
                1600
              );

          },
          maxDuration
        );

    }


    /* =========================================================
       INITIALIZE
    ========================================================= */

    updateAudioButton();

    startMusic();


    window.addEventListener(
      "pointerdown",
      startMusic,
      { once:true }
    );


    window.addEventListener(
      "touchstart",
      startMusic,
      { once:true }
    );


    audioToggle.addEventListener(
      "click",
      () => {

        muted = !muted;


        updateAudioButton();


        if(!muted){

          startMusic();

        }else{

          portalMusic.pause();

        }

      }
    );

  </script>

</body>
</html>
